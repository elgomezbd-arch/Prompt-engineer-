<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body class="bg-zinc-950">
    <div id="root">
      <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #09090b; color: #71717a; font-family: sans-serif;">
        <div style="text-align: center;">
          <div style="width: 40px; height: 40px; border: 3px solid #27272a; border-top-color: #f4f4f5; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
          <p style="font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;">Initializing Architect...</p>
        </div>
      </div>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      console.log("[INDEX] HTML loaded, starting script module...");
      window.addEventListener('load', () => {
        console.log("[INDEX] Page fully loaded");
        setTimeout(() => {
          const root = document.getElementById('root');
          if (root && root.querySelector('p')) {
            const p = root.querySelector('p');
            if (p.textContent && p.textContent.includes('Initializing')) {
              console.error("[INDEX] Architect failed to initialize within 5s. This may be a script loading error.");
              p.style.color = '#ef4444';
              p.innerHTML = 'Initialization delayed. <br/><span style="font-size: 10px; text-transform: none; opacity: 0.7;">Check console for errors or click <button onclick="location.reload()" style="background:none; border:none; color:white; text-decoration:underline; cursor:pointer; padding:0; font:inherit;">here</button> to retry.</span>';
            }
          }
        }, 8000);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
